[pytest]
# 默认跳过需要真实外部 API 的测试（无 key 也全绿）；显式 -m integration_api 才跑。
addopts = -m "not integration_api"

markers =
    unit: 单元测试（无外部依赖）
    integration: 集成测试（含 SQLite）
    e2e: 端到端场景
    smoke: 冒烟/消融（返回结构化结果，非严格断言）
    integration_api: 需要真实外部 API（DeepSeek 等）的测试，默认跳过

# tests/test_ablation.py 的 test_* 函数返回结构化 dict 供消融报告使用，
# 由 pytest 收集作冒烟（能跑不崩）。抑制「测试函数应返回 None」的告警噪音。
# 注：这 6 个冒烟收集**不会失败**，所以另加了 test_persona_routing_is_accurate /
#     test_tool_discovery_covers_expected 两条真断言测试（见该文件末尾），保证关键指标真的被卡住。
filterwarnings =
    ignore::pytest.PytestReturnNotNoneWarning
    # 注：第三方导入期告警（FastAPI testclient 提示改用 httpx2、LangChain 弃用 ConversationBufferMemory）
    # 都不在这里过滤 —— 实测 pytest 的 ini 类别解析对第三方类不生效，已在各自的**源头**受控抑制：
    #   · StarletteDeprecationWarning → tests/conftest.py 顶部的「受控预热导入」
    #   · LangChainDeprecationWarning → tests/test_ablation.py::_make_mock_state 的局部 catch_warnings
    # 这样「自有代码零告警」这件事依然可见（当前 pytest 输出为 0 warning）。
