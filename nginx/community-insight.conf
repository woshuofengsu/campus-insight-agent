# CommunityInsight — Nginx HTTPS 反代配置（docker-compose 的 web-nginx 服务使用）
# 完整说明见 docs/deploy-https.md §2.3 / §3。
# 证书路径由 compose 挂载到 /etc/letsencrypt/live/insight.example.com（替换为你的域名）。

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name insight.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name insight.example.com;

    ssl_certificate     /etc/letsencrypt/live/insight.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insight.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 附件 ≤5MB，留余量
    client_max_body_size 6m;

    location / {
        # 反代到 web 容器（compose 服务名）
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
