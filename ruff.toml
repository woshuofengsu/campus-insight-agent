# ruff 配置（WS9.2/H2 修订）：主服务静态检查，接入 CI（ci.yml / test.yml 均运行 `ruff check .`）。
#
# 说明（诚实口径）：
#   - ruff 作为 CI 门禁，**只 gate 真实 Bug 类规则**（F 未定义/重复定义/无效变量 + B bugbear），
#     确保无未定义/重复定义/类型陷阱；其余 dead-code/风格类（F401 未导入、F841 未用本地、F541 f-string、
#     I 导入排序、UP 升级、SIM 简化、E7xx 等）为**延后批量清理**，不在 CI 强制（避免对大仓库 legacy 大范围 churn）。
#   - 排除 legacy / 历史实现：ui/（1.3 万行 Streamlit 界面）、app.py、api.py（扣子入口）、
#     agent/engine.py（LangChain OODA 旧链，评审建议不动）。
#   - 项目既定惯例，全局豁免：宽 except 吞异常（BLE001，多数入口故意）、try/except pass（S110/S112）、
#     SQLite 本地时间（DTZ005）、中文全角标点（RUF001-3）、行长（E501）、E402（import 放在 sys.path 后），
#     以及本次确认的次要不影响行为的规则（B007 循环下标未用、B013 单元素元组冗余、B017 宽 assert、B905 zip 严格模式；
#     这些在现有代码里为已知可接受用法，列此避免误报，同时说明不扩展到大改）。
#
# 用法： `python -m ruff check .` 应输出 Found 0 errors（当前 focus 集）。
# 运行基线：`python -m pytest tests/ -q` 495 passed。

exclude = [
    "ui",
    "app.py",
    "api.py",
    "agent/engine.py",
    "data/community_insight.db",
    "web/node_modules",
    "web/dist",
]

line-length = 120

[lint]
# 聚焦真实 Bug：F（undefined/redefined/unused-variable 之类）+ B（bugbear）
select = ["F", "B"]
ignore = [
    # --- 死代码/风格类：延后批量清理，不 gate ---
    "F401",   # 未使用 import（大量历史模块，延后清理）
    "F841",   # 未使用本地变量（同上）
    "F541",   # f-string 无占位符（多为中文提示串，延后）
    # --- 项目既定惯例 ---
    "BLE001", "S110", "S112", "DTZ005", "RUF001", "RUF002", "RUF003", "E501", "E402",
    # --- 已确认无关行为的次要规则（避免误报） ---
    "B007", "B013", "B017", "B905",
]

[lint.per-file-ignores]
"tests/**" = ["A001", "SIM117", "S105", "S106", "S101", "B017", "B007", "B905"]
