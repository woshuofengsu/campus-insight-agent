# ruff 配置（WS9.2）：为现代主路线（FastAPI + Vue3 主服务）做静态检查。
# 说明：
#   - 排除历史/legacy：ui/（1.3 万行 Streamlit 界面）、app.py（备线）、api.py（扣子入口）、
#     agent/engine.py（LangChain OODA 旧链路，评审建议不动）。
#   - 项目通行的设计模式：广泛 except 吞异常（以 debug 日志留痕而非上报）、SQLite 本地时间，
#     故对 BLE001 / S110 / S112 / DTZ005 作全局降级（这些是刻意为之，非缺陷）。
#   - 本文件聚焦：未用导入(F)、导入排序(I)、升级建议(UP)、未用 noqa(RUF)、架构可用性(PLW) 等卫生项。
exclude = [
    "ui",
    "app.py",
    "api.py",
    "agent/engine.py",
    "data/community_insight.db",
    "web/node_modules",
    "web/dist",
]

line-length = 120

[lint]
select = ["E", "F", "W", "I", "UP", "RUF", "B", "PLW", "C4", "SIM"]
ignore = [
    "BLE001",   # 项目刻意在多数入口 catch 宽异常并 debug 留痕（防单点故障），不视为缺陷
    "S110",     # try-except-pass：多处用于可选数据轮询降级
    "S112",     # try-except-continue：降级跳过
    "DTZ005",   # 项目统一用 SQLite 本地时间（naive datetime），刻意为之
    "E501",     # 保持与现有行宽不一致，人工平衡可读性
    "E402",     # 本仓库大量把 import 放在 sys.path 设置之后（可运行性优先）
    "RUF001",   # 中文用户提示串用全角标点，属刻意，非歧义
    "RUF002",   # 中文文档/注释用全角标点，属项目惯例，非歧义
    "RUF003",   # 中文评论用全角标点，属项目惯例，非歧义
]

[lint.per-file-ignores]
"tests/**" = ["A001", "SIM117", "S105", "S106", "S101"]
"web/**" = ["ALL"]
